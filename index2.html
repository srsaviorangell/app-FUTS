<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel Horizontal com 100 Caixas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .esconder-barra::-webkit-scrollbar {
            display: none;
        }
        .esconder-barra {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-900 p-8 h-screen w-screen overflow-hidden">
 <div class="bg-gray-400 p-4">
        <p class="border bg-blue-500 text-white p-2 inline-block">Esta caixa deve se ajustar ao tamanho do texto.</p>
    </div>
    

</body>
